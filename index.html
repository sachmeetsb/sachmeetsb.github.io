<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Paint before external CSS/JS. Keep the static fallback available when
         JavaScript is disabled or the application bundle fails to start. -->
    <style>
      html,body{margin:0;background:#0F0A1E;color:#fff}
      #site-boot{display:none}
      html.app-pending #root{visibility:hidden}
      html.app-pending #site-boot{display:flex;position:fixed;inset:0;z-index:101;align-items:center;justify-content:center;flex-direction:column;gap:24px;background:#0F0A1E;font-family:system-ui,sans-serif}
      #site-boot strong{font-size:40px;letter-spacing:-1px}
      #site-boot strong span{color:#FF7A35}
      #site-boot p{margin:0;font-size:13px;color:#b9b4c5}
    </style>
    <script>
      document.documentElement.classList.add('app-pending');
      window.__kartarBootTimeout = setTimeout(function () {
        document.documentElement.classList.remove('app-pending');
      }, 10000);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/kartar-logo-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Product Development with Sachmeet | Kartar AI Labs</title>
    <meta name="description" content="Explore AI products and workflow automation from Kartar AI Labs. Watch product demos and discuss your business workflow with founder Sachmeet." />
    <meta name="author" content="Kartar AI Labs" />

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kartar AI Labs" />
    <meta property="og:title" content="AI Product Development with Sachmeet | Kartar AI Labs" />
    <meta property="og:description" content="Work directly with Sachmeet to build an AI product or improve a business workflow. Explore real product demos and discuss your project." />
    <meta property="og:image" content="https://kartar.ai/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://kartar.ai/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI Product Development with Sachmeet | Kartar AI Labs" />
    <meta name="twitter:description" content="Work directly with Sachmeet to build an AI product or improve a business workflow. Explore real product demos and discuss your project." />
    <meta name="twitter:image" content="https://kartar.ai/og-image.png" />

    <!-- Additional SEO Meta Tags -->
    <meta name="robots" content="index, follow" />
    <meta name="geo.region" content="IN" />
    <link rel="canonical" href="https://kartar.ai/" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://kartar.ai/#organization",
          "name": "Kartar AI Labs",
          "url": "https://kartar.ai/",
          "logo": "https://kartar.ai/kartar-logo-mark.png",
          "email": "hello@kartar.ai",
          "description": "Kartar AI Labs builds AI products and workflow automation for Indian businesses.",
          "areaServed": "IN",
          "sameAs": ["https://www.linkedin.com/company/kartar-ai/"]
        },
        {
          "@type": "WebSite",
          "@id": "https://kartar.ai/#website",
          "url": "https://kartar.ai/",
          "name": "Kartar AI Labs",
          "publisher": { "@id": "https://kartar.ai/#organization" }
        }
      ]
    }
    </script>

    <!-- Analytics: add your snippet here (Plausible / PostHog / Cloudflare Web
         Analytics). Intentionally left empty until an account is chosen. -->

  </head>
  <body>
    <div id="site-boot" role="status" aria-live="polite">
      <strong>kartar<span>AI</span></strong>
      <p>Opening Kartar…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
